[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubernetes-doctor-mvp"
version = "0.2.0"
description = "Evidence-driven multi-cluster Kubernetes diagnostic CLI and offline dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Kubernetes Doctor contributors"}]
dependencies = ["kubernetes>=28,<36"]
keywords = ["kubernetes", "troubleshooting", "diagnostics", "topology", "gpu", "multicluster"]

[project.scripts]
kdoctor = "kubernetes_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
